<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>RTS - Tactical Intelligence Final V36</title>
    <style>
        body { 
            background: #111; color: #eee; display: flex; flex-direction: column; 
            align-items: center; font-family: 'Courier New', Courier, monospace; 
            margin: 0; padding: 10px 10px 40px 10px; overflow-x: hidden; user-select: none;
        }
        
        .header-ui { text-align: center; margin-bottom: 10px; width: 800px; }
        
        .top-row { display: flex; justify-content: center; align-items: center; gap: 40px; margin-bottom: 5px; }
        .timer { font-size: 1.5em; color: #fff; font-weight: bold; }
        .lv-red { color: #fca5a5; transition: color 0.3s; font-size: 1.2em; font-weight: bold; width: 60px; text-align: right; }
        .lv-blue { color: #93c5fd; transition: color 0.3s; font-size: 1.2em; font-weight: bold; width: 60px; text-align: left; }
        
        .scoreboard { font-size: 2.2em; font-weight: bold; display: flex; justify-content: center; gap: 30px; margin-bottom: 5px; }
        .score-red { color: #ef4444; }
        .score-blue { color: #3b82f6; }
        
        .game-wrapper { display: flex; justify-content: center; align-items: flex-start; gap: 15px; width: 100%; max-width: 1400px; position: relative; }
        .center-panel { display: flex; flex-direction: column; align-items: center; position: relative; }
        canvas { background: #1a1a24; box-shadow: 0 0 30px rgba(0,0,0,0.8); border: 2px solid #444; cursor: crosshair; }

        /* コントロール群 */
        .bottom-controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 15px; width: 100%; background: #1e1e28; padding: 10px; border-radius: 8px; border: 1px solid #444; box-sizing: border-box; }
        .speed-controls { display: flex; gap: 6px; }
        .speed-btn { padding: 6px 0; width: 45px; text-align: center; cursor: pointer; background: #333; border: 1px solid #555; border-radius: 4px; font-weight: bold; color: #aaa; transition: 0.2s; font-size: 0.9em; }
        .speed-btn:hover { background: #444; color: #fff; }
        .speed-btn.active { background: #10b981; color: #fff; border-color: #059669; }
        .toggle-container { font-size: 0.9em; color: #ddd; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .toggle-container input { cursor: pointer; width: 16px; height: 16px; }

        /* サイドパネル & カード UI */
        .side-panel { display: flex; flex-direction: column; width: 280px; gap: 10px; }
        .team-board { display: flex; flex-direction: column; gap: 8px; }
        
        .unit-card { background: #1e1e28; border: 1px solid #444; padding: 10px; border-radius: 6px; font-size: 0.8em; transition: opacity 0.3s; }
        .red-panel .unit-card { border-left: 4px solid #ef4444; }
        .blue-panel .unit-card { border-left: 4px solid #3b82f6; }
        .dead-unit { opacity: 0.4; filter: grayscale(100%); }
        
        .unit-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.05em; margin-bottom: 4px; align-items: center; }
        .role-icon { width: 12px; height: 12px; display: inline-block; margin-right: 4px; }
        
        .hp-bar-bg { background: #333; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 6px; border: 1px solid #111; }
        .hp-bar-fill { height: 100%; transition: width 0.2s ease, background 0.2s; }
        
        .unit-action { color: #fbbf24; font-weight: bold; background: #2a2a35; padding: 4px 6px; border-radius: 4px; margin-bottom: 6px; text-align: center; border: 1px solid #444; font-size: 0.85em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .unit-action.casting { color: #fff; background: #c2410c; border-color: #fbbf24; animation: blink 0.8s infinite alternate; }
        @keyframes blink { from { opacity: 1; } to { opacity: 0.6; } }

        .unit-stats { color: #aaa; margin-bottom: 8px; display: flex; justify-content: space-between; background: #111; padding: 4px 8px; border-radius: 3px; }
        .stat-val { font-weight: bold; color: #ddd; }
        
        .skill-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
        .skill-name { width: 110px; color: #ccc; font-size: 0.85em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .skill-cd-bar { flex: 1; height: 8px; background: #111; border: 1px solid #333; position: relative; border-radius: 2px; overflow: hidden; }
        .skill-cd-fill { height: 100%; transition: width 0.1s linear; }

        .ult-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding-top: 6px; border-top: 1px dashed #555; }
        .ult-name { width: 110px; color: #fbbf24; font-size: 0.85em; font-weight: bold; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-shadow: 0 0 5px rgba(251, 191, 36, 0.5); }
        .ult-cd-bar { flex: 1; height: 10px; background: #111; border: 1px solid #555; position: relative; border-radius: 3px; overflow: hidden; }
        .ult-cd-fill { height: 100%; transition: width 0.1s linear; background: #3b82f6; }
        .ult-ready .ult-cd-fill { background: linear-gradient(90deg, #fbbf24, #f59e0b, #fbbf24); background-size: 200% 100%; animation: shimmer 1s infinite linear; }
        @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

        .overlay { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); width: 700px; background: rgba(20, 20, 30, 0.95); border: 2px solid #555; padding: 30px; border-radius: 10px; z-index: 100; text-align: center; box-shadow: 0 0 50px rgba(0,0,0,1); }
        .hidden { display: none; }
        h1 { margin: 0 0 15px 0; color: #fbbf24; font-size: 2em; }
        
        #pauseOverlay { position: absolute; top: 10px; width: 100%; text-align: center; pointer-events: none; z-index: 10; }
        #pauseOverlay h1 { font-size: 4em; color: rgba(255,255,255,0.9); text-shadow: 0 0 15px #000; margin: 0; letter-spacing: 5px; }
        
        .player-inputs { display: flex; justify-content: center; gap: 50px; margin-bottom: 20px; }
        .team-inputs { display: flex; flex-direction: column; gap: 8px; width: 160px; }
        .team-inputs input { padding: 6px; border-radius: 4px; border: 1px solid #555; background: #222; color: #fff; text-align: center; font-family: inherit; }
        .team-inputs h3 { margin: 0 0 5px 0; font-size: 1.1em; }

        .result-details { display: flex; justify-content: space-around; margin-top: 20px; text-align: left; font-size: 1.1em; width: 100%; }
        .result-team-block { display: flex; flex-direction: column; gap: 5px; width: 45%; }
        .result-list { display: flex; flex-direction: column; gap: 8px; width: 100%; font-family: monospace; font-size: 1.1em; }
        .result-row { display: flex; justify-content: space-between; border-bottom: 1px dashed #444; padding-bottom: 4px; }
        .kill-count { display: inline-block; width: 2em; text-align: right; }
        
        button.main-btn { padding: 10px 30px; cursor: pointer; background: #10b981; border: none; border-radius: 4px; font-weight: bold; color: white; transition: 0.2s; font-size: 1.2em; }
        button.main-btn:hover { background: #059669; }
    </style>
</head>
<body>

<div class="header-ui">
    <div class="top-row">
        <span class="lv-red" id="redLevelDisplay">Lv. 1</span>
        <div class="timer" id="timerDisplay">03:00</div>
        <span class="lv-blue" id="blueLevelDisplay">Lv. 1</span>
    </div>
    
    <div class="scoreboard">
        <span class="score-red" id="scoreRed">0</span>
        <span style="color:#555">vs</span>
        <span class="score-blue" id="scoreBlue">0</span>
    </div>
</div>

<div class="game-wrapper">
    <div class="side-panel red-panel"><div id="redTeamBoard" class="team-board"></div></div>
    
    <div class="center-panel">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div class="bottom-controls">
            <div class="speed-controls">
                <button id="btnSpeed1" class="speed-btn active" onclick="setSpeed(1)">1x</button>
                <button id="btnSpeed2" class="speed-btn" onclick="setSpeed(2)">2x</button>
                <button id="btnSpeed4" class="speed-btn" onclick="setSpeed(4)">4x</button>
            </div>
            <label class="toggle-container">
                <input type="checkbox" id="toggleIntent" checked>目標矢印を表示
            </label>
            <label class="toggle-container">
                <input type="checkbox" id="toggleAnnounce" checked>アナウンス音声
            </label>
        </div>

        <div id="pauseOverlay" class="hidden"><h1>PAUSED</h1></div>
    </div>
    
    <div class="side-panel blue-panel"><div id="blueTeamBoard" class="team-board"></div></div>
</div>

<div id="startScreen" class="overlay">
    <h1>TACTICAL BATTLE V36</h1>
    <div class="player-inputs">
        <div class="team-inputs red-inputs">
            <h3 style="color:#ef4444;">RED TEAM</h3>
            <input type="text" id="r_p1" placeholder="Player 1" maxlength="8">
            <input type="text" id="r_p2" placeholder="Player 2" maxlength="8">
            <input type="text" id="r_p3" placeholder="Player 3" maxlength="8">
        </div>
        <div class="team-inputs blue-inputs">
            <h3 style="color:#3b82f6;">BLUE TEAM</h3>
            <input type="text" id="b_p1" placeholder="Player 1" maxlength="8">
            <input type="text" id="b_p2" placeholder="Player 2" maxlength="8">
            <input type="text" id="b_p3" placeholder="Player 3" maxlength="8">
        </div>
    </div>
    <button class="main-btn" onclick="startGame()" style="margin-top: 10px;">GAME START</button>
</div>

<div id="resultScreen" class="overlay hidden" style="top: 150px;">
    <h1 id="resultTitle">RESULT</h1>
    <h2 id="resultScore" style="font-size: 2.5em; margin-bottom: 5px;">0 - 0</h2>
    <div class="result-details">
        <div id="redResult" class="result-team-block" style="color:#ef4444;"></div>
        <div id="blueResult" class="result-team-block" style="color:#3b82f6;"></div>
    </div>
    <button class="main-btn" onclick="location.reload()" style="margin-top: 30px;">REMATCH</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 800, HEIGHT = 600, TILE = 20;
    const COLS = WIDTH / TILE, ROWS = HEIGHT / TILE;
    
    const bgCanvas = document.createElement('canvas');
    bgCanvas.width = WIDTH; bgCanvas.height = HEIGHT;
    const bgCtx = bgCanvas.getContext('2d');

    const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const dist = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);

    // ★ UI制御関連
    let showIntentLines = true;
    let announceEnabled = true;

    document.getElementById('toggleIntent').addEventListener('change', (e) => { 
        showIntentLines = e.target.checked; 
    });
    document.getElementById('toggleAnnounce').addEventListener('change', (e) => { 
        announceEnabled = e.target.checked; 
        if (!announceEnabled && window.speechSynthesis) window.speechSynthesis.cancel();
    });

    let gameSpeed = 1;
    function setSpeed(speed) {
        gameSpeed = speed;
        document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btnSpeed' + speed).classList.add('active');
    }

    // ★ 音声アナウンス機能
    function speak(text) {
        if (!announceEnabled || !window.speechSynthesis) return;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = 2.0;  // 読み上げ速度: 2
        utterance.pitch = 2.0; // ピッチ: 2
        window.speechSynthesis.speak(utterance);
    }
    const CP_PRONOUNCE = { 'α': 'アルファ', 'β': 'ベータ', 'γ': 'ガンマ', 'Δ': 'デルタ', 'ε': 'イプシロン' };

    let mapData = [], units = [], projectiles = [], controlPoints = [], effects = [];
    let animId, battleTimer = 180 * 60, isGameOver = false, isPaused = false, frameCount = 0, drawFrameCount = 0;
    let activeCutins = [];

    // 入力名の保持 (localStorage)
    const inputIds = ['r_p1', 'r_p2', 'r_p3', 'b_p1', 'b_p2', 'b_p3'];
    window.onload = () => {
        inputIds.forEach(id => {
            let saved = localStorage.getItem('rts_name_' + id);
            if (saved) document.getElementById(id).value = saved;
        });
    };

    let mouseX = -1, mouseY = -1;
    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left; 
        mouseY = e.clientY - rect.top;
    });

    let teamState = { 
        0: { currentStrat: "START", stratTimer: 0, defenderId: null, level: 1, kills: 0 }, 
        1: { currentStrat: "START", stratTimer: 0, defenderId: null, level: 1, kills: 0 } 
    };

    const getLevelMult = (level) => 1.0 + (Math.min(9, level) - 1) * 0.05;

    // --- DB・定数群 ---
    const SKILLS_DB = [
        { id: 'Heal_S',   name: '小回復',       cat: 'heal', cd: 20*60, val: 0.3, type: 'heal' },
        { id: 'Heal_M',   name: '中回復',       cat: 'heal', cd: 45*60, val: 0.6, type: 'heal' },
        { id: 'Heal_Grad',name: '継続回復',     cat: 'heal', cd: 40*60, val: 1.0, type: 'heal_grad', dur: 10*60 },
        { id: 'Atk_Heavy',name: '強攻撃',       cat: 'atk',  cd: 20*60, dmgMult: 5, type: 'atk' },
        { id: 'Atk_Stun', name: 'スタン攻撃',   cat: 'atk',  cd: 30*60, stunDur: 4*60, type: 'atk' },
        { id: 'Atk_Vamp', name: '吸収攻撃',     cat: 'atk',  cd: 25*60, dmgMult: 2, vamp: 0.5, type: 'atk' },
        { id: 'Def_M',    name: '防御UP',       cat: 'def',  cd: 40*60, mult: 3, type: 'def_buff', dur: 10*60 },
        { id: 'Def_L',    name: '大防御UP',     cat: 'def',  cd: 40*60, mult: 10, type: 'def_buff', dur: 10*60 },
        { id: 'Buff_Atk', name: '攻撃UP',       cat: 'buff', cd: 50*60, mult: 3, type: 'buff_atk', dur: 5*60 },
        { id: 'Buff_Spd', name: '速度UP',       cat: 'buff', cd: 30*60, mult: 2, type: 'buff_spd', dur: 10*60 },
        { id: 'Sup_Heal', name: '全体継続回復', cat: 'sup',  cd: 60*60, val: 0.6, type: 'sup_heal', dur: 10*60 },
        { id: 'Sup_Spd',  name: '全体速度UP',   cat: 'sup',  cd: 60*60, mult: 1.6, type: 'sup_spd', dur: 10*60 }
    ];

    const PREFS = {
        ATTACKER: { heal: 25, atk: 50, def: 5,  buff: 15, sup: 5 },
        GUNNER:   { heal: 25, atk: 50, def: 5,  buff: 10, sup: 10 },
        TANK:     { heal: 40, atk: 5,  def: 40, buff: 0,  sup: 15 },
        SPRINTER: { heal: 15, atk: 20, def: 10, buff: 40, sup: 15 }
    };

    const ULT_DB = {
        ATTACKER: [
            { id: 'U_FATAL', name: '致命の一撃', spMax: 4000, type: 'ult_atk', dmgMult: 20 },
            { id: 'U_AREA',  name: '範囲攻撃',   spMax: 6000, type: 'ult_area', dmgMult: 5 }
        ],
        GUNNER: [
            { id: 'U_STUN',  name: '全体スタン', spMax: 9000, type: 'ult_g_stun', stunDur: 4*60 },
            { id: 'U_BOMB',  name: '拠点爆撃',   spMax: 7000, type: 'ult_g_bomb', dmgMult: 10 }
        ],
        TANK: [
            { id: 'U_BARRIER',name: '全体大バリア',spMax: 8000, type: 'ult_t_bar', dur: 12*60, mult: 10 },
            { id: 'U_INSTANT',name: '瞬間制圧',   spMax: 10000, type: 'ult_t_cap' }
        ],
        SPRINTER: [
            { id: 'U_SABOTAGE',name:'拠点妨害',   spMax: 8000, type: 'ult_s_sab' },
            { id: 'U_SPEED',   name:'超速度',     spMax: 5000, type: 'ult_s_spd', dur: 10*60, mult: 3 }
        ]
    };

    const ROLES = {
        ATTACKER: { s: 'A', name: 'ATTACKER', rng: 55,  search: 240, hp: 14000, dmg: 2800, def: 1000, spd: 1.7, cd: 35 },
        GUNNER:   { s: 'G', name: 'GUNNER',   rng: 165, search: 350, hp:  9500, dmg: 3200, def:  800, spd: 1.2, cd: 45 },
        SPRINTER: { s: 'S', name: 'SPRINTER', rng: 45,  search: 220, hp:  9000, dmg: 1600, def:  800, spd: 2.8, cd: 30 },
        TANK:     { s: 'T', name: 'TANK',     rng: 45,  search: 150, hp: 32000, dmg: 1400, def: 1500, spd: 1.0, cd: 60 }
    };

    const ROLE_SYMBOLS = { 'ATTACKER': '▲', 'GUNNER': '●', 'SPRINTER': '◆', 'TANK': '⬢' };

    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return; 

        if (e.code === 'Space') {
            e.preventDefault(); 
            if (isGameOver || !document.getElementById('startScreen').classList.contains('hidden')) return;
            isPaused = !isPaused;
            document.getElementById('pauseOverlay').classList.toggle('hidden', !isPaused);
        }
        if (e.key === '1') setSpeed(1);
        if (e.key === '2') setSpeed(2);
        if (e.key === '3') setSpeed(4);
    });

    // --- エフェクト描画系 ---
    function addEffect(type, x, y, team, extra = {}) {
        let color = team === 0 ? "rgba(239,68,68," : "rgba(59,130,246,";
        if (type === 'cast') effects.push({ type: 'cast', x: x, y: y, radius: 40, color: color, life: extra.life, maxLife: extra.life });
        else if (type === 'slash') effects.push({ type: 'slash', x: x, y: y, color: color, life: 30, maxLife: 30 });
        else if (type === 'shockwave') effects.push({ type: 'shockwave', x: x, y: y, radius: 10, maxRadius: 120, color: color, life: 40, maxLife: 40 });
        else if (type === 'emp') effects.push({ type: 'emp', x: x, y: y, radius: 10, maxRadius: WIDTH * 1.5, color: "rgba(167,139,250,", life: 60, maxLife: 60 });
        else if (type === 'bomb') effects.push({ type: 'bomb', x: x, y: y, radius: 10, maxRadius: 80, color: "rgba(245,158,11,", life: 50, maxLife: 50 });
        else if (type === 'buff') effects.push({ type: 'buff', x: x, y: y, radius: 20, maxRadius: 50, color: "rgba(251,191,36,", life: 40, maxLife: 40 });
    }

    function updateEffects() {
        for (let i = effects.length - 1; i >= 0; i--) {
            effects[i].life--;
            if (effects[i].life <= 0) effects.splice(i, 1);
        }
    }

    function drawEffects() {
        for (let i = 0; i < effects.length; i++) {
            let e = effects[i]; let ratio = e.life / e.maxLife; let invRatio = 1 - ratio;
            ctx.save();
            if (e.type === 'cast') {
                ctx.beginPath(); ctx.arc(e.x, e.y, e.radius * ratio, 0, Math.PI * 2);
                ctx.strokeStyle = e.color + (0.5 * ratio) + ")"; ctx.lineWidth = 3; ctx.stroke();
            } else if (e.type === 'slash') {
                ctx.translate(e.x, e.y); ctx.rotate(Math.PI / 4);
                ctx.fillStyle = e.color + ratio + ")"; ctx.fillRect(-30, -5, 60, 10); 
                ctx.rotate(-Math.PI / 2); ctx.fillRect(-30, -5, 60, 10);
            } else if (e.type === 'shockwave' || e.type === 'emp' || e.type === 'bomb' || e.type === 'buff') {
                ctx.beginPath(); let currentR = e.radius + (e.maxRadius - e.radius) * Math.pow(invRatio, 0.5);
                ctx.arc(e.x, e.y, currentR, 0, Math.PI * 2);
                if (e.type === 'bomb') { ctx.fillStyle = e.color + (ratio * 0.7) + ")"; ctx.fill(); } 
                else { ctx.strokeStyle = e.color + ratio + ")"; ctx.lineWidth = e.type === 'emp' ? 8 : 4; ctx.stroke(); }
            }
            ctx.restore();
        }
    }

    function drawRoleShape(ctx, roleKey, x, y, r, fillStyle, strokeStyle, isStunned) {
        ctx.beginPath();
        if (roleKey === 'GUNNER') ctx.arc(x, y, r, 0, Math.PI * 2);
        else if (roleKey === 'ATTACKER') { ctx.moveTo(x, y - r); ctx.lineTo(x + r*0.866, y + r*0.5); ctx.lineTo(x - r*0.866, y + r*0.5); ctx.closePath(); }
        else if (roleKey === 'SPRINTER') { ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); }
        else if (roleKey === 'TANK') {
            for (let i = 0; i < 6; i++) {
                let a = i * Math.PI / 3;
                if (i === 0) ctx.moveTo(x + r * Math.cos(a), y + r * Math.sin(a));
                else ctx.lineTo(x + r * Math.cos(a), y + r * Math.sin(a));
            }
            ctx.closePath();
        }
        ctx.fillStyle = fillStyle; ctx.fill();
        ctx.strokeStyle = (isStunned && Math.floor(Date.now() / 100) % 2 === 0) ? "#fff" : strokeStyle;
        ctx.lineWidth = isStunned ? 3 : 2; ctx.stroke();
    }

    // --- クラス定義 ---
    class ControlPoint {
        constructor(id, x, y, label, time, maxRadius) {
            this.id = id; this.x = x; this.y = y; this.label = label;
            this.maxGauge = time * 60; this.currentGauge = 0;
            this.owner = 'neutral'; this.iconSize = 20;
            this.maxRadius = maxRadius;
            this.lockTimer = 0; this.isContested = false;
            this.occupiers = { 0: [], 1: [] };
        }
        
        update(unitsList) {
            if (this.lockTimer > 0) { this.lockTimer--; return; }
            let reds = unitsList.filter(u => u.team === 0 && u.state === 'alive' && dist(u.x, u.y, this.x, this.y) < this.iconSize * 1.2);
            let blues = unitsList.filter(u => u.team === 1 && u.state === 'alive' && dist(u.x, u.y, this.x, this.y) < this.iconSize * 1.2);
            
            this.occupiers[0] = reds; this.occupiers[1] = blues;
            this.isContested = (reds.length > 0 && blues.length > 0);

            const complete = (team, members) => { 
                this.owner = team; 
                this.currentGauge = 1; 
                this.lockTimer = 30; 
                if(members && members.length > 0) {
                    members.forEach(u => {
                        u.stunTimer = 20;
                        // ★ 拠点制圧に成功したプレイヤーは体力全回復
                        u.hp = u.getMaxHp();
                    });
                    // ★ 制圧アナウンス
                    speak(`${members[0].playerName}が拠点${CP_PRONOUNCE[this.label]}を制圧しました`);
                }
            };

            if (this.owner === 'neutral') {
                if (reds.length > 0 && blues.length === 0) complete(0, reds);
                else if (blues.length > 0 && reds.length === 0) complete(1, blues);
                return;
            }

            if (this.isContested) return;

            let dom = reds.length > 0 ? 0 : blues.length > 0 ? 1 : -1;
            if (dom !== -1) {
                if (this.owner !== dom) {
                    this.currentGauge -= 1;
                    if (this.currentGauge <= 0) complete(dom, dom === 0 ? reds : blues);
                } else if (this.currentGauge < this.maxGauge) {
                    this.currentGauge = Math.min(this.maxGauge, this.currentGauge + 1);
                }
            }
        }
        
        draw() {
            if (this.owner !== 'neutral') {
                ctx.beginPath(); 
                ctx.arc(this.x, this.y, this.maxRadius * (this.currentGauge / this.maxGauge), 0, Math.PI * 2);
                ctx.fillStyle = this.owner === 0 ? "rgba(239, 68, 68, 0.15)" : "rgba(59, 130, 246, 0.15)"; 
                ctx.fill();
            }
            ctx.fillStyle = this.owner === 'neutral' ? "#4b5563" : (this.owner === 0 ? "#ef4444" : "#3b82f6");
            ctx.fillRect(this.x - 10, this.y - 10, 20, 20);
            ctx.strokeStyle = (this.isContested && Math.floor(Date.now() / 150) % 2 === 0) ? "#fbbf24" : "#fff";
            ctx.lineWidth = this.isContested ? 2 : 1;
            ctx.strokeRect(this.x - 10, this.y - 10, 20, 20);
            ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(this.label, this.x, this.y + 1);
        }
    }

    class Unit {
        static nextId = 0;
        constructor(team, roleKey, pName) {
            this.id = Unit.nextId++;
            this.team = team; this.roleKey = roleKey; this.roleData = ROLES[roleKey];
            this.playerName = pName || this.roleData.name;
            this.radius = 10; this.kills = 0; 
            
            this.baseHp = this.roleData.hp; this.baseDmg = this.roleData.dmg;
            this.baseDef = this.roleData.def; this.baseSpd = this.roleData.spd;
            this.rng = this.roleData.rng; this.searchRange = this.roleData.search; this.cdMax = this.roleData.cd;
            
            this.atkMult = 1.0; this.atkBuffT = 0; this.defMult = 1.0; this.defBuffT = 0;
            this.spdMult = 1.0; this.spdBuffT = 0;
            this.isInvincible = false; this.gradHealT = 0; this.gradHealV = 0;

            this.skills = this.assignSkills(roleKey);
            let ultPool = ULT_DB[roleKey];
            this.ult = { ...ultPool[rand(0, ultPool.length - 1)], currentSp: 0 };

            this.decisionTimer = 0; this.stunTimer = 0; this.ultCastTimer = 0; this.ultTarget = null; 
            this.currentObjective = null; this.prevObjective = null; this.intentTimer = 0;
            this.path = []; this.pTimer = 0; this.actionString = "待機";
            this.prevX = 0; this.prevY = 0; this.idleTimer = 0;
            
            this.hp = this.getMaxHp();
            this.spawn();
        }

        getMaxHp() { return this.baseHp * getLevelMult(teamState[this.team].level); }
        getAtk() { return this.baseDmg * this.atkMult * getLevelMult(teamState[this.team].level); }
        getDef() { return this.baseDef * this.defMult * getLevelMult(teamState[this.team].level); }
        getSpd() { return this.baseSpd * this.spdMult; }

        assignSkills(role) {
            let selected = []; let pool = [...SKILLS_DB].sort(() => 0.5 - Math.random());
            const prefs = PREFS[role];
            if (Math.random() < 0.8) {
                let heals = pool.filter(s => s.cat === 'heal');
                if (heals.length > 0) { let h = heals[rand(0, heals.length - 1)]; selected.push(h); pool = pool.filter(s => s.id !== h.id); }
            }
            let failsafe = 0;
            while(selected.length < 4 && pool.length > 0 && failsafe < 50) {
                failsafe++; let totalWeight = pool.reduce((sum, s) => sum + (prefs[s.cat] || 0), 0);
                if (totalWeight <= 0) { selected.push(pool.pop()); continue; }
                let r = Math.random() * totalWeight, sum = 0;
                for (let i = 0; i < pool.length; i++) {
                    sum += (prefs[pool[i].cat] || 0);
                    if (r <= sum) { selected.push(pool[i]); pool.splice(i, 1); break; }
                }
            }
            return selected.map(s => ({ ...s, currentCd: 0 }));
        }

        spawn() {
            const b = this.team === 0 ? spawnRed : spawnBlue;
            this.x = b.x + rand(-15, 15); this.y = b.y + rand(-15, 15);
            this.state = 'alive'; this.hp = this.getMaxHp(); 
            this.cooldown = 0; this.stunTimer = 0; this.ultCastTimer = 0; this.isInvincible = false;
            this.decisionTimer = 0; this.currentObjective = null; this.prevObjective = null; this.path = [];
            this.atkMult = 1.0; this.atkBuffT = 0; this.defMult = 1.0; this.defBuffT = 0;
            this.spdMult = 1.0; this.spdBuffT = 0; 
            // リスポーン時にCDはリセットしない（時間経過でのみ回復）
            this.actionString = "出撃準備"; this.idleTimer = 0; this.intentTimer = 0;
        }

        getRetreatTarget(allies, myBase) {
            let myBases = controlPoints.filter(cp => cp.owner === this.team && cp.currentGauge >= cp.maxGauge);
            if (myBases.length > 0) return myBases.sort((a,b) => dist(this.x, this.y, a.x, a.y) - dist(this.x, this.y, b.x, b.y))[0];
            let aliveAllies = allies.filter(a => a.state === 'alive' && a.id !== this.id);
            if (aliveAllies.length > 0) return aliveAllies.sort((a,b) => dist(a.x, a.y, myBase.x, myBase.y) - dist(b.x, b.y, myBase.x, myBase.y))[0];
            return { x: myBase.x, y: myBase.y, type: 'base' };
        }

        update() {
            // ★ スキルCDは生死に関わらず常に回復（時間経過）
            this.skills.forEach(s => { if (s.currentCd > 0) s.currentCd--; });

            if (this.state === 'dead') { 
                this.actionString = "リスポーン中";
                if (Date.now() - this.deathTime > 3000) this.spawn(); 
                return; 
            }

            if (this.intentTimer > 0) this.intentTimer--;

            if (this.atkBuffT > 0) { this.atkBuffT--; if (this.atkBuffT <= 0) this.atkMult = 1.0; }
            if (this.defBuffT > 0) { this.defBuffT--; if (this.defBuffT <= 0 && this.ultCastTimer <= 0) { this.defMult = 1.0; this.isInvincible = false; } }
            if (this.spdBuffT > 0) { this.spdBuffT--; if (this.spdBuffT <= 0) this.spdMult = 1.0; }
            if (this.gradHealT > 0) { this.hp = Math.min(this.getMaxHp(), this.hp + this.gradHealV); this.gradHealT--; }

            if (this.ultCastTimer > 0) {
                this.ultCastTimer--; this.isInvincible = true; 
                addEffect('cast', this.x, this.y, this.team, {life: this.ultCastTimer});
                if (this.ultCastTimer <= 0) {
                    this.executeUlt();
                    this.isInvincible = (this.defBuffT > 0 && this.defMult > 10); 
                }
                return; 
            }

            let isOnCP = false;
            for (let cp of controlPoints) {
                if (cp.occupiers[this.team].includes(this)) {
                    isOnCP = true;
                    // 敵がいない時のみSPチャージ
                    if (cp.occupiers[1 - this.team].length === 0) {
                        this.ult.currentSp += 1;
                        if (cp.owner !== this.team || cp.currentGauge < cp.maxGauge) {
                            this.ult.currentSp += 2; 
                        }
                    }
                    break;
                }
            }
            if (this.ult.currentSp > this.ult.spMax) this.ult.currentSp = this.ult.spMax;

            if (this.stunTimer > 0) { this.stunTimer--; this.path = []; return; }

            const enemies = units.filter(u => u.team !== this.team && u.state === 'alive');
            const allies = units.filter(u => u.team === this.team && u.state === 'alive' && u !== this);
            const myStrategy = teamState[this.team].currentStrat;
            let e = this.findEnemy(enemies);

            let moved = dist(this.x, this.y, this.prevX, this.prevY) > 0.5;
            let fighting = (this.cooldown > this.cdMax - 5); 
            if (!moved && !fighting && !isOnCP) this.idleTimer++; else this.idleTimer = 0;
            this.prevX = this.x; this.prevY = this.y;

            if (this.idleTimer > 120) { this.decisionTimer = 0; this.currentObjective = null; this.idleTimer = 0; this.path = []; }

            // ULT 発動判断
            if (this.ult.currentSp >= this.ult.spMax) {
                let shouldCast = false; let targetData = null;
                if (this.hp < this.getMaxHp() * 0.25 && e && dist(this.x, this.y, e.x, e.y) < 150 && isOnCP) {
                    shouldCast = true; targetData = e;
                } else {
                    if (this.ult.type === 'ult_atk' && e) {
                        let estDmg = this.getAtk() * this.ult.dmgMult * (1000 / (1000 + e.getDef()));
                        if (e.hp <= estDmg || e.hp > e.getMaxHp() * 0.6) { shouldCast = true; targetData = e; }
                    } else if (this.ult.type === 'ult_area') {
                        let closeEnemies = enemies.filter(ev => dist(this.x, this.y, ev.x, ev.y) < 120);
                        if (closeEnemies.length >= 2 || (closeEnemies.length === 1 && closeEnemies[0].hp < this.getAtk() * this.ult.dmgMult)) {
                            shouldCast = true; targetData = this;
                        }
                    } else if (this.ult.type === 'ult_g_stun' && enemies.length >= 2) {
                        if (allies.some(a => enemies.some(ev => dist(a.x, a.y, ev.x, ev.y) < 200))) { shouldCast = true; targetData = null; }
                    } else if (this.ult.type === 'ult_g_bomb') {
                        let targetCp = controlPoints.find(cp => cp.owner !== this.team && cp.occupiers[1-this.team].length >= 1);
                        if (targetCp) { shouldCast = true; targetData = targetCp; }
                    } else if (this.ult.type === 'ult_t_bar') {
                        if (allies.some(a => enemies.some(ev => dist(a.x, a.y, ev.x, ev.y) < 150))) { shouldCast = true; targetData = null; }
                    } else if (this.ult.type === 'ult_t_cap' && isOnCP) {
                        let myCp = controlPoints.find(cp => cp.occupiers[this.team].includes(this));
                        if (myCp && myCp.owner !== this.team && (myCp.occupiers[1-this.team].length > 0 || myCp.currentGauge < myCp.maxGauge * 0.3)) { 
                            shouldCast = true; targetData = myCp; 
                        }
                    } else if (this.ult.type === 'ult_s_sab') {
                        if (controlPoints.filter(cp => cp.owner === 1 - this.team && cp.currentGauge > cp.maxGauge * 0.8).length >= 2) { shouldCast = true; targetData = null; }
                    } else if (this.ult.type === 'ult_s_spd') {
                        if (myStrategy === 'OFFENSIVE' || myStrategy === 'START') { shouldCast = true; targetData = null; }
                    }
                }

                if (shouldCast) {
                    this.ult.currentSp = 0;
                    this.ultCastTimer = Math.max(60, Math.floor((this.ult.spMax / 10000) * 300));
                    this.ultTarget = targetData; this.path = []; this.actionString = `【ULT詠唱中】`;
                    return;
                }
            }

            // 通常スキル判定
            for (let s of this.skills) {
                if (s.currentCd > 0) continue;
                if (this.roleKey !== 'TANK' && e && dist(this.x, this.y, e.x, e.y) < 160 && s.stun >= 60) continue; 
                
                let used = false; let maxH = this.getMaxHp();
                if (s.type === 'heal' && this.hp < maxH * 0.4) used = true;
                if (s.type === 'heal_grad' && this.hp < maxH * 0.6) used = true;
                if (s.type === 'def_buff' && e && dist(this.x, this.y, e.x, e.y) < 200) used = true;
                if (s.type === 'buff_atk' && e && dist(this.x, this.y, e.x, e.y) < this.rng + 50) used = true;
                if (s.type === 'buff_spd' && myStrategy !== 'TURTLE') used = true;
                if (s.type === 'atk' && e && dist(this.x, this.y, e.x, e.y) <= this.rng && !isWallBetween(this.x, this.y, e.x, e.y)) { this.fire(e, s); used = true; }
                if (s.type === 'sup_heal' && this.hp < maxH * 0.7) used = true;
                if (s.type === 'sup_spd' && myStrategy === 'OFFENSIVE') used = true;

                if (used) {
                    s.currentCd = s.cd; this.stunTimer = s.stun;
                    if (s.type === 'heal') this.hp = Math.min(maxH, this.hp + maxH * s.val);
                    if (s.type === 'heal_grad') { this.gradHealT = s.dur; this.gradHealV = (maxH * s.val) / s.dur; }
                    if (s.type === 'def_buff') { if (s.invincible) { this.isInvincible = true; this.spdMult = 0.5; } else this.defMult = s.mult; this.defBuffT = s.dur; }
                    if (s.type === 'buff_atk') { this.atkMult = s.mult; this.atkBuffT = s.dur; }
                    if (s.type === 'buff_spd') { this.spdMult = s.mult; this.spdBuffT = s.dur; }
                    if (s.type === 'sup_heal') { units.filter(u => u.team === this.team && u.state === 'alive').forEach(u => { u.gradHealT = s.dur; u.gradHealV = (u.getMaxHp() * s.val) / s.dur; }); }
                    if (s.type === 'sup_spd') { units.filter(u => u.team === this.team && u.state === 'alive').forEach(u => { u.spdMult = s.mult; u.spdBuffT = s.dur; }); }
                    return; 
                }
            }

            if (this.currentObjective instanceof Unit && this.currentObjective.state === 'dead') this.currentObjective = null;
            if (this.currentObjective instanceof ControlPoint && this.currentObjective.owner === this.team && this.currentObjective.currentGauge >= this.currentObjective.maxGauge) this.currentObjective = null;

            if (!this.currentObjective || this.decisionTimer-- <= 0) {
                this.decisionTimer = 60; this.currentObjective = this.think(enemies, allies, myStrategy);
            }
            if (this.currentObjective !== this.prevObjective && this.currentObjective) {
                this.intentTimer = 60; this.prevObjective = this.currentObjective;
            }

            let goal = this.currentObjective;
            if (goal instanceof Unit && goal.team !== this.team) this.actionString = `攻撃: 敵[${goal.playerName}]`;
            else if (goal instanceof ControlPoint) this.actionString = (goal.owner === this.team ? "防衛" : "制圧") + `: 拠点 ${goal.label}`;
            else if (goal instanceof Unit && goal.team === this.team) this.actionString = `合流: 味方[${goal.playerName}]`;
            else if (goal) this.actionString = `一時撤退・再編`;
            else this.actionString = isOnCP ? "SPチャージ中" : "待機中";

            let isMoving = false;
            if (goal) {
                let targetX = goal.x, targetY = goal.y; let d = dist(this.x, this.y, targetX, targetY);
                if (goal instanceof Unit) {
                    if (goal.team !== this.team) {
                        if (d <= this.rng && !isWallBetween(this.x, this.y, targetX, targetY)) {
                            this.path = []; if (this.cooldown <= 0) { this.fire(goal, {}); this.cooldown = this.cdMax; }
                        } else isMoving = true;
                    } else {
                        if (d > 20) isMoving = true; else this.path = [];
                    }
                } else if (goal instanceof ControlPoint) {
                    if (d > 14) isMoving = true; else this.path = [];
                } else {
                    if (d > 20) isMoving = true; else this.path = [];
                }

                if (isMoving) {
                    let currentSpd = this.getSpd();
                    if (!isWallBetween(this.x, this.y, targetX, targetY)) {
                        let a = Math.atan2(targetY - this.y, targetX - this.x);
                        this.x += Math.cos(a) * currentSpd; this.y += Math.sin(a) * currentSpd; this.path = [];
                    } else {
                        if (this.pTimer-- <= 0 || this.path.length === 0) { this.path = findPath(this, goal); this.pTimer = 30; }
                        if (this.path.length > 0) {
                            let n = this.path[0]; let nd = dist(this.x, this.y, n.x, n.y);
                            if (nd < currentSpd) { this.x = n.x; this.y = n.y; this.path.shift(); } 
                            else { let a = Math.atan2(n.y - this.y, n.x - this.x); this.x += Math.cos(a) * currentSpd; this.y += Math.sin(a) * currentSpd; }
                        }
                    }
                }
            }

            let sepX = 0, sepY = 0;
            units.forEach(u => {
                if (u !== this && u.state === 'alive') {
                    let d = dist(this.x, this.y, u.x, u.y);
                    if (d > 0 && d < this.radius * 2) {
                        let overlap = (this.radius * 2) - d;
                        let a = Math.atan2(this.y - u.y, this.x - u.x);
                        sepX += Math.cos(a) * overlap * 0.1; sepY += Math.sin(a) * overlap * 0.1;
                    }
                }
            });
            let nextX = this.x + sepX, nextY = this.y + sepY;
            if (mapData[Math.floor(nextY/TILE)] && mapData[Math.floor(nextY/TILE)][Math.floor(nextX/TILE)]) {
                this.x = nextX; this.y = nextY;
            }
            if (this.cooldown > 0) this.cooldown--;
        }

        executeUlt() {
            const enemies = units.filter(u => u.team !== this.team && u.state === 'alive');
            const allies = units.filter(u => u.team === this.team && u.state === 'alive');
            
            if (this.ult.type === 'ult_atk' && this.ultTarget && this.ultTarget.state === 'alive') {
                this.fire(this.ultTarget, {dmgMult: this.ult.dmgMult});
                addEffect('slash', this.ultTarget.x, this.ultTarget.y, this.team);
            }
            else if (this.ult.type === 'ult_area') {
                addEffect('shockwave', this.x, this.y, this.team);
                enemies.filter(ev => dist(this.x, this.y, ev.x, ev.y) < 120 && !isWallBetween(this.x, this.y, ev.x, ev.y)).forEach(ev => {
                    let d = Math.max(1, (this.getAtk() * this.ult.dmgMult) * (1000 / (1000 + (ev.isInvincible ? 999999 : ev.getDef()))));
                    ev.hp -= d; if (ev.hp <= 0) processKill(this, ev, this.team);
                });
            }
            else if (this.ult.type === 'ult_g_stun') {
                addEffect('emp', this.x, this.y, this.team);
                enemies.forEach(ev => ev.stunTimer = Math.max(ev.stunTimer, this.ult.stunDur));
            }
            else if (this.ult.type === 'ult_g_bomb' && this.ultTarget) {
                addEffect('bomb', this.ultTarget.x, this.ultTarget.y, this.team);
                this.ultTarget.occupiers[1-this.team].forEach(ev => {
                    let d = Math.max(1, (this.getAtk() * this.ult.dmgMult) * (1000 / (1000 + (ev.isInvincible ? 999999 : ev.getDef()))));
                    ev.hp -= d; if (ev.hp <= 0) processKill(this, ev, this.team);
                });
            }
            else if (this.ult.type === 'ult_t_bar') {
                allies.forEach(a => { a.defMult = this.ult.mult; a.defBuffT = this.ult.dur; addEffect('buff', a.x, a.y, this.team); });
            }
            else if (this.ult.type === 'ult_t_cap' && this.ultTarget) {
                this.ultTarget.owner = this.team; this.ultTarget.currentGauge = this.ultTarget.maxGauge; 
                addEffect('buff', this.ultTarget.x, this.ultTarget.y, this.team);
            }
            else if (this.ult.type === 'ult_s_sab') {
                controlPoints.filter(cp => cp.owner === 1 - this.team).forEach(cp => {
                    cp.currentGauge = Math.floor(cp.maxGauge / 2); addEffect('bomb', cp.x, cp.y, this.team);
                });
            }
            else if (this.ult.type === 'ult_s_spd') {
                this.spdMult = this.ult.mult; this.spdBuffT = this.ult.dur; addEffect('buff', this.x, this.y, this.team);
            }
        }

        findEnemy(enemies) {
            let closest = null, minDist = Infinity;
            enemies.forEach(e => {
                let d = dist(this.x, this.y, e.x, e.y);
                if (d < this.searchRange && !isWallBetween(this.x, this.y, e.x, e.y)) { if (d < minDist) { minDist = d; closest = e; } }
            });
            return closest;
        }

        think(enemies, allies, strategy) {
            const myBase = (this.team === 0) ? spawnRed : spawnBlue;
            const myHomeIdx = this.team === 0 ? 1 : 2; const my2ndIdx = this.team === 0 ? 3 : 4;  
            const myHome = controlPoints[myHomeIdx]; const my2nd = controlPoints[my2ndIdx];
            let e = this.findEnemy(enemies);

            if (strategy === "START") {
                let target = null;
                if (this.roleKey === 'SPRINTER' || this.roleKey === 'TANK') {
                    if (my2nd.owner !== this.team || my2nd.currentGauge < my2nd.maxGauge) target = my2nd;
                    else if (myHome.owner !== this.team || myHome.currentGauge < myHome.maxGauge) target = myHome;
                } else {
                    if (myHome.owner !== this.team || myHome.currentGauge < myHome.maxGauge) target = myHome;
                    else if (my2nd.owner !== this.team || my2nd.currentGauge < my2nd.maxGauge) target = my2nd;
                }
                if (target) return target;
            }

            if (strategy === "RECOVERY") return this.getRetreatTarget(allies, myBase);
            if (strategy === "TURTLE") {
                let myIncomplete = controlPoints.filter(cp => cp.owner === this.team && cp.currentGauge < cp.maxGauge);
                let myBases = controlPoints.filter(cp => cp.owner === this.team);
                let frontBase = myBases.sort((a,b) => dist(b.x, b.y, myBase.x, myBase.y) - dist(a.x, a.y, myBase.x, myBase.y))[0] || myBase;

                if (this.roleKey === 'SPRINTER' || this.roleKey === 'TANK') {
                    if (myIncomplete.length > 0) return myIncomplete.sort((a,b) => dist(this.x, this.y, a.x, a.y) - dist(this.x, this.y, b.x, b.y))[0];
                    return frontBase; 
                }

                let defEnemies = enemies.filter(ev => dist(ev.x, ev.y, frontBase.x, frontBase.y) < 250);
                if (defEnemies.length > 0) return defEnemies.sort((a,b) => dist(this.x, this.y, a.x, a.y) - dist(this.x, this.y, b.x, b.y))[0];
                return frontBase;
            }

            let needsDefense = [];
            if (myHome.owner !== this.team || myHome.currentGauge < myHome.maxGauge) needsDefense.push(myHome);
            if (my2nd.owner !== this.team || my2nd.currentGauge < my2nd.maxGauge) needsDefense.push(my2nd);

            let isDefender = (teamState[this.team].defenderId === this.id);
            if (isDefender && needsDefense.length > 0) return needsDefense.sort((a,b) => dist(this.x, this.y, a.x, a.y) - dist(this.x, this.y, b.x, b.y))[0];

            let needsCharge = (this.ult.currentSp < this.ult.spMax);
            let safeMyBases = controlPoints.filter(cp => cp.owner === this.team && cp.currentGauge >= cp.maxGauge && cp.occupiers[1-this.team].length === 0);

            let targetableCPs = controlPoints.filter(cp => {
                if (!isDefender && needsDefense.length > 0) { if (cp.id === myHomeIdx || cp.id === my2ndIdx) return false; }
                return cp.owner !== this.team || cp.currentGauge < cp.maxGauge;
            });

            if (this.roleKey === 'SPRINTER') {
                let safeTargets = targetableCPs.filter(cp => cp.occupiers[1-this.team].length === 0);
                if (safeTargets.length > 0) return safeTargets.sort((a,b) => dist(this.x, this.y, a.x, a.y) - dist(this.x, this.y, b.x, b.y))[0];
                if (e && dist(this.x, this.y, e.x, e.y) < 100) return e; 
                if (needsCharge && safeMyBases.length > 0) return safeMyBases[0]; 
                return targetableCPs[0] || controlPoints[0];
            }

            if (this.roleKey === 'TANK') {
                if (targetableCPs.length > 0) {
                    let mid = targetableCPs.find(cp => cp.label === 'γ'); 
                    if (mid && (mid.owner !== this.team || mid.currentGauge < mid.maxGauge)) return mid;
                    return targetableCPs.sort((a,b) => dist(this.x, this.y, a.x, a.y) - dist(this.x, this.y, b.x, b.y))[0];
                }
                if (needsCharge && safeMyBases.length > 0) return safeMyBases[0];
                return controlPoints[0];
            }

            if (e) {
                let levelDiff = teamState[this.team].level - teamState[1-this.team].level;
                const eN = enemies.filter(ev => dist(this.x,this.y,ev.x,ev.y) < 200).length;
                const aN = units.filter(av => av.team === this.team && av.state === 'alive' && dist(this.x,this.y,av.x,av.y) < 200).length;
                let retreatThreshold = aN + (levelDiff >= 0 ? 1 : 0);
                if (eN > retreatThreshold) return this.getRetreatTarget(allies, myBase);
                
                let defEnemy = enemies.find(ev => controlPoints.some(cp => cp.occupiers[1 - this.team].includes(ev)));
                if (defEnemy) return defEnemy;
                return e;
            }

            if (needsCharge && safeMyBases.length > 0) return safeMyBases.sort((a,b) => dist(this.x, this.y, a.x, a.y) - dist(this.x, this.y, b.x, b.y))[0];

            let neutrals = targetableCPs.filter(cp => cp.owner === 'neutral');
            if (neutrals.length > 0) return neutrals[0];
            return targetableCPs[0] || controlPoints[0];
        }

        fire(t, options) { 
            let finalDmg = this.getAtk() * (options.dmgMult || 1);
            let a = Math.atan2(t.y - this.y, t.x - this.x);
            projectiles.push({ x: this.x, y: this.y, vx: Math.cos(a) * 6, vy: Math.sin(a) * 6, team: this.team, life: 35, dmg: finalDmg, stun: options.stunDur || 0, vamp: options.vamp || 0, owner: this }); 
        }
        
        draw() {
            if (this.state === 'dead') return;
            if (showIntentLines && this.intentTimer > 0 && this.currentObjective) {
                let tx = this.currentObjective.x || this.x; let ty = this.currentObjective.y || this.y;
                ctx.save(); ctx.globalAlpha = this.intentTimer / 60; ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(tx, ty);
                ctx.strokeStyle = this.team === 0 ? "rgba(239, 68, 68, 0.8)" : "rgba(59, 130, 246, 0.8)";
                ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke();
                let angle = Math.atan2(ty - this.y, tx - this.x); ctx.beginPath(); ctx.moveTo(tx, ty);
                ctx.lineTo(tx - 10 * Math.cos(angle - Math.PI / 6), ty - 10 * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(tx - 10 * Math.cos(angle + Math.PI / 6), ty - 10 * Math.sin(angle + Math.PI / 6));
                ctx.closePath(); ctx.fillStyle = ctx.strokeStyle; ctx.fill(); ctx.restore();
            }

            let fillCol = (this.team === 0) ? "#ef4444" : "#3b82f6";
            drawRoleShape(ctx, this.roleKey, this.x, this.y, this.radius, fillCol, "#fff", (this.stunTimer > 0 || this.ultCastTimer > 0));

            let maxH = this.getMaxHp(); let hpRatio = Math.max(0, this.hp / maxH);
            ctx.fillStyle = "#000"; ctx.fillRect(this.x - 12, this.y - 18, 24, 4);
            ctx.fillStyle = hpRatio > 0.5 ? "#10b981" : hpRatio > 0.2 ? "#fbbf24" : "#ef4444";
            if (this.stunTimer > 0 || this.ultCastTimer > 0) ctx.fillStyle = "#fff";
            ctx.fillRect(this.x - 12, this.y - 18, 24 * hpRatio, 4);

            ctx.fillStyle = "#aaa"; ctx.font = "9px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(this.playerName, this.x, this.y + 18);
        }
    }

    // ★ キル処理とレベルアップの一元管理
    function processKill(killer, victim, teamId) {
        victim.state = 'dead'; 
        victim.deathTime = Date.now(); 
        killer.kills++; 
        
        let totalKills = units.filter(u => u.team === teamId).reduce((sum, u) => sum + u.kills, 0);
        teamState[teamId].kills = totalKills; 
        
        let newLv = Math.min(9, 1 + totalKills); 
        if (teamState[teamId].level !== newLv) {
            teamState[teamId].level = newLv;
            units.filter(u => u.team === teamId).forEach(u => {
                let oldMax = u.baseHp * getLevelMult(newLv - 1);
                let r = Math.max(0, u.hp / oldMax);
                if (u.state === 'alive') u.hp = u.getMaxHp() * r;
            });
            let el = document.getElementById(teamId === 0 ? 'redLevelDisplay' : 'blueLevelDisplay');
            let baseColor = teamId === 0 ? "#fca5a5" : "#93c5fd";
            el.style.color = "#fff"; setTimeout(() => { el.style.color = baseColor; }, 300);
        }

        // ★ キルアナウンス
        speak(`${killer.playerName}が${victim.playerName}をキルしました`);
    }

    function generateMap() {
        mapData = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        const fillRect = (x, y, w, h) => {
            for (let r = y; r < y + h; r++) {
                for (let c = x; c < x + w; c++) {
                    if (r >= 0 && r < ROWS && c >= 0 && c < COLS) { mapData[r][c] = 1; mapData[ROWS - 1 - r][COLS - 1 - c] = 1; }
                }
            }
        };
        const drawLine = (x1, y1, x2, y2) => {
            let cx = x1, cy = y1;
            while (cx !== x2) { fillRect(cx, cy, 2, 2); cx += (x2 > cx ? 1 : -1); }
            while (cy !== y2) { fillRect(cx, cy, 2, 2); cy += (y2 > cy ? 1 : -1); }
        };

        const snapVal = (v) => Math.floor(v / 20); const midC = Math.floor(COLS / 2), midR = Math.floor(ROWS / 2);
        let bX = snapVal(rand(60, 240)), bY = snapVal(rand(300, 480)); 
        let sX = snapVal(rand(120, 300)), sY = snapVal(rand(80, 260)); 

        fillRect(midC - 4, midR - 4, 8, 8); fillRect(1, 1, 4, 4); 
        spawnRed = { x: 3 * TILE, y: 3 * TILE }; spawnBlue = { x: (COLS-3)*TILE, y: (ROWS-3)*TILE };
        fillRect(bX, bY, 7, 7); fillRect(sX, sY, 7, 7); 

        drawLine(3, 3, bX+3, bY+3); drawLine(bX+3, bY+3, midC, midR); drawLine(midC, midR, sX+3, sY+3); drawLine(3, 3, sX+3, sY+3); 
        if (Math.random() > 0.4) drawLine(sX+3, sY+3, COLS-(sX+3), ROWS-(sY+3));
        
        controlPoints = [
            new ControlPoint(0, midC*TILE, midR*TILE, 'γ', 5, 55),
            new ControlPoint(1, (bX+3)*TILE, (bY+3)*TILE, 'α', 20, 95), new ControlPoint(2, (COLS-(bX+3))*TILE, (ROWS-(bY+3))*TILE, 'ε', 20, 95),
            new ControlPoint(3, (sX+3)*TILE, (sY+3)*TILE, 'β', 15, 75), new ControlPoint(4, (COLS-(sX+3))*TILE, (ROWS-(sY+3))*TILE, 'Δ', 15, 75)
        ];

        bgCtx.fillStyle = "#1a1a24"; bgCtx.fillRect(0, 0, WIDTH, HEIGHT);
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (mapData[r][c] === 1) { bgCtx.fillStyle = "#3b4252"; bgCtx.fillRect(c*TILE, r*TILE, TILE, TILE); }
            }
        }
    }

    function isWallBetween(x1, y1, x2, y2) {
        let d = dist(x1, y1, x2, y2), steps = Math.ceil(d / 10);
        for (let i = 0; i <= steps; i++) {
            let px = x1 + (x2 - x1)*(i/steps), py = y1 + (y2 - y1)*(i/steps);
            if (!mapData[Math.floor(py/TILE)] || !mapData[Math.floor(py/TILE)][Math.floor(px/TILE)]) return true;
        }
        return false;
    }

    function findPath(s, t) {
        let sc = Math.floor(s.x/TILE), sr = Math.floor(s.y/TILE), tc = Math.floor((t.x||t.x)/TILE), tr = Math.floor((t.y||t.y)/TILE);
        if(tc<0||tc>=COLS||tr<0||tr>=ROWS||!mapData[tr][tc]) return [];
        let q = [{c:sc, r:sr, p:[]}], vis = new Set([sc+','+sr]);
        while(q.length > 0) {
            let curr = q.shift();
            if(curr.c === tc && curr.r === tr) return curr.p;
            [[0,1],[1,0],[0,-1],[-1,0]].forEach(d => {
                let nc = curr.c + d[0], nr = curr.r + d[1], k = nc+','+nr;
                if (nc>=0 && nc<COLS && nr>=0 && nr<ROWS && mapData[nr][nc] && !vis.has(k)) { 
                    vis.add(k); q.push({c:nc, r:nr, p:curr.p.concat([{x:nc*TILE+10, y:nr*TILE+10}])}); 
                }
            });
        } return [];
    }

    function updateStrategy() {
        [0, 1].forEach(team => {
            const myHomeIdx = team === 0 ? 1 : 2; const my2ndIdx = team === 0 ? 3 : 4;
            const myHome = controlPoints[myHomeIdx]; const my2nd = controlPoints[my2ndIdx];

            let needsDefense = [];
            if (myHome.owner !== team || myHome.currentGauge < myHome.maxGauge) needsDefense.push(myHome);
            if (my2nd.owner !== team || my2nd.currentGauge < my2nd.maxGauge) needsDefense.push(my2nd);

            let currentDefender = units.find(u => u.id === teamState[team].defenderId && u.state === 'alive' && u.team === team);
            if (needsDefense.length > 0) {
                if (!currentDefender) {
                    let available = units.filter(u => u.team === team && u.state === 'alive');
                    if (available.length > 0) {
                        let targetBase = needsDefense[0];
                        available.sort((a,b) => dist(a.x, a.y, targetBase.x, targetBase.y) - dist(b.x, b.y, targetBase.x, targetBase.y));
                        teamState[team].defenderId = available[0].id;
                    }
                }
            } else teamState[team].defenderId = null;

            const isHomeSecure = (myHome.owner === team && myHome.currentGauge >= myHome.maxGauge) && 
                                 (my2nd.owner === team && my2nd.currentGauge >= my2nd.maxGauge);
            
            if (!teamState[team].hasSecuredHome) {
                if (isHomeSecure || battleTimer < (180 - 30) * 60) teamState[team].hasSecuredHome = true;
                else { teamState[team].currentStrat = "START"; return; }
            }

            if (teamState[team].stratTimer > 0) { teamState[team].stratTimer--; return; }

            const myP = controlPoints.filter(cp => cp.owner === team).length;
            const alive = units.filter(u => u.team === team && u.state === 'alive').length;

            let nextStrat = "OFFENSIVE", duration = 15;
            let isLosingLevel = teamState[team].level < teamState[1-team].level;

            if (alive <= 1) { nextStrat = "RECOVERY"; duration = 8; }
            else if (myP >= 3) { nextStrat = "TURTLE"; duration = 15; }
            else if (isLosingLevel && Math.random() < 0.6) { nextStrat = "WOLF_PACK"; duration = 12; }
            
            teamState[team].currentStrat = nextStrat; teamState[team].stratTimer = duration;
        });
        document.getElementById('redLevelDisplay').innerText = `Lv. ${teamState[0].level}`;
        document.getElementById('blueLevelDisplay').innerText = `Lv. ${teamState[1].level}`;
    }

    function updateDashboard() {
        const buildTeamHTML = (teamId) => {
            let html = '';
            const roleOrder = ['ATTACKER', 'GUNNER', 'SPRINTER', 'TANK'];
            const teamUnits = units.filter(u => u.team === teamId).sort((a, b) => roleOrder.indexOf(a.roleKey) - roleOrder.indexOf(b.roleKey));
            
            teamUnits.forEach(u => {
                let isDead = u.state === 'dead'; let cardClass = isDead ? 'unit-card dead-unit' : 'unit-card';
                let maxH = u.getMaxHp(); let hpRatio = Math.max(0, u.hp / maxH) * 100;

                if (isDead) hpColor = '#555';

                let statsHTML = `<span class="stat-val">ATK: ${Math.floor(u.getAtk())}</span><span class="stat-val">DEF: ${Math.floor(u.getDef())}</span><span class="stat-val">SPD: ${u.getSpd().toFixed(1)}</span>`;
                
                let skillsHTML = u.skills.map(s => {
                    let cdRatio = (s.currentCd / s.cd) * 100; let isReady = s.currentCd <= 0;
                    let fillStyle = isReady ? 'width: 100%; background: #10b981;' : `width: ${100 - cdRatio}%; background: #fbbf24;`;
                    return `<div class="skill-row"><div class="skill-name">${s.name}</div><div class="skill-cd-bar"><div class="skill-cd-fill" style="${fillStyle}"></div></div></div>`;
                }).join('');

                let ultRatio = Math.min(100, (u.ult.currentSp / u.ult.spMax) * 100);
                let isUltReady = u.ult.currentSp >= u.ult.spMax;
                let ultClass = isUltReady ? "ult-row ult-ready" : "ult-row";
                
                let iconSvg = ''; let tColor = teamId === 0 ? '#ef4444' : '#3b82f6';
                if (u.roleKey === 'ATTACKER') iconSvg = `<svg width="12" height="12" viewBox="0 0 24 24"><polygon points="12,2 22,22 2,22" fill="${tColor}"/></svg>`;
                else if (u.roleKey === 'GUNNER') iconSvg = `<svg width="12" height="12" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="${tColor}"/></svg>`;
                else if (u.roleKey === 'SPRINTER') iconSvg = `<svg width="12" height="12" viewBox="0 0 24 24"><polygon points="12,2 22,12 12,22 2,12" fill="${tColor}"/></svg>`;
                else if (u.roleKey === 'TANK') iconSvg = `<svg width="12" height="12" viewBox="0 0 24 24"><polygon points="12,2 22,7 22,17 12,22 2,17 2,7" fill="${tColor}"/></svg>`;

                let actionClass = u.ultCastTimer > 0 ? "unit-action casting" : "unit-action";

                html += `
                    <div class="${cardClass}">
                        <div class="unit-header">
                            <div><span class="role-icon">${iconSvg}</span> <span>${u.playerName}</span></div>
                            <span style="color:${isDead ? '#888' : '#0f0'}">HP: ${Math.max(0, Math.floor(u.hp))}/${Math.floor(maxH)}</span>
                        </div>
                        <div class="hp-bar-bg"><div class="hp-bar-fill" style="width: ${hpRatio}%; background: ${hpColor};"></div></div>
                        <div class="${actionClass}">${u.actionString}</div>
                        <div class="unit-stats">${statsHTML}</div>
                        <div class="skills">${skillsHTML}</div>
                        <div class="${ultClass}">
                            <div class="ult-name">ULT: ${u.ult.name}</div>
                            <div class="ult-cd-bar"><div class="ult-cd-fill" style="width: ${ultRatio}%;"></div></div>
                        </div>
                    </div>
                `;
            });
            return html;
        };
        document.getElementById('redTeamBoard').innerHTML = buildTeamHTML(0);
        document.getElementById('blueTeamBoard').innerHTML = buildTeamHTML(1);
    }

    function drawTooltip() {
        if (mouseX < 0 || mouseY < 0) return;
        let hovered = null;
        for (let u of units) {
            if (u.state === 'alive' && dist(u.x, u.y, mouseX, mouseY) < u.radius * 1.5) { hovered = { type: 'unit', data: u }; break; }
        }
        if (!hovered) {
            for (let cp of controlPoints) {
                if (dist(cp.x, cp.y, mouseX, mouseY) < cp.iconSize) { hovered = { type: 'cp', data: cp }; break; }
            }
        }
        if (hovered) {
            ctx.save(); ctx.font = "12px sans-serif"; let lines = [];
            if (hovered.type === 'unit') {
                let u = hovered.data;
                lines.push(`[${u.roleData.name}] ${u.playerName}`);
                lines.push(`${u.actionString}`);
                let buffs = [];
                if (u.atkBuffT > 0) buffs.push("攻撃UP");
                if (u.defBuffT > 0) buffs.push(u.isInvincible ? "無敵" : "防御UP");
                if (u.spdBuffT > 0) buffs.push("速度UP");
                if (u.gradHealT > 0) buffs.push("持続回復");
                if (buffs.length > 0) lines.push(`効果: ${buffs.join(', ')}`);
            } else {
                let cp = hovered.data; let pt = Math.floor((cp.currentGauge / cp.maxGauge) * 100);
                lines.push(`拠点 ${cp.label}`);
                lines.push(`所有: ${cp.owner === 'neutral' ? '中立' : (cp.owner === 0 ? 'RED TEAM' : 'BLUE TEAM')}`);
                lines.push(`制圧率: ${pt}%`);
            }
            let maxWidth = 0;
            lines.forEach(l => { let w = ctx.measureText(l).width; if(w > maxWidth) maxWidth = w; });
            let boxW = maxWidth + 16, boxH = lines.length * 16 + 10, bx = mouseX + 15, by = mouseY + 15;
            if (bx + boxW > WIDTH) bx = mouseX - boxW - 10;
            if (by + boxH > HEIGHT) by = mouseY - boxH - 10;
            ctx.fillStyle = "rgba(10, 10, 15, 0.9)"; ctx.strokeStyle = "#555"; ctx.lineWidth = 1;
            ctx.fillRect(bx, by, boxW, boxH); ctx.strokeRect(bx, by, boxW, boxH);
            ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "top";
            lines.forEach((l, i) => { ctx.fillText(l, bx + 8, by + 8 + i * 16); });
            ctx.restore();
        }
    }

    function startGame() {
        if (document.activeElement) document.activeElement.blur(); 
        if (window.speechSynthesis) window.speechSynthesis.cancel(); 

        const rNames = [ 
            document.getElementById('r_p1').value.trim() || 'Player1', 
            document.getElementById('r_p2').value.trim() || 'Player2', 
            document.getElementById('r_p3').value.trim() || 'Player3' 
        ];
        const bNames = [ 
            document.getElementById('b_p1').value.trim() || 'Player1', 
            document.getElementById('b_p2').value.trim() || 'Player2', 
            document.getElementById('b_p3').value.trim() || 'Player3' 
        ];

        inputIds.forEach(id => localStorage.setItem('rts_name_' + id, document.getElementById(id).value.trim()));

        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('pauseOverlay').classList.add('hidden');
        isPaused = false;
        
        generateMap(); units = []; projectiles = []; effects = []; frameCount = 0; drawFrameCount = 0;
        
        teamState = { 
            0: { currentStrat: "START", stratTimer: 0, defenderId: null, level: 1, kills: 0 }, 
            1: { currentStrat: "START", stratTimer: 0, defenderId: null, level: 1, kills: 0 } 
        };

        const allRoles = ['ATTACKER','GUNNER','TANK','SPRINTER'];
        const rRed = [...allRoles].sort(() => 0.5 - Math.random()).slice(0, 3);
        const rBlue = [...allRoles].sort(() => 0.5 - Math.random()).slice(0, 3);
        
        rRed.forEach((k, i) => units.push(new Unit(0, k, rNames[i])));
        rBlue.forEach((k, i) => units.push(new Unit(1, k, bNames[i])));
        
        battleTimer = 180 * 60; isGameOver = false;
        
        // ★ バトル開始アナウンス
        speak("バトル開始です");
        loop();
    }

    function endGame() {
        isGameOver = true; 
        const rP = controlPoints.filter(cp => cp.owner === 0).length;
        const bP = controlPoints.filter(cp => cp.owner === 1).length;
        
        let winT = "DRAW MATCH";
        let speechText = "バトル終了です。引き分けです。";
        
        if (rP > bP) {
            winT = "RED TEAM WIN!";
            speechText = "バトル終了です。レッドチームが勝利しました。";
        } else if (bP > rP) {
            winT = "BLUE TEAM WIN!";
            speechText = "バトル終了です。ブルーチームが勝利しました。";
        }
        
        document.getElementById('resultTitle').innerText = winT;
        document.getElementById('resultScore').innerText = `${rP} - ${bP}`;

        const fmt = (teamId) => {
            let h = `<div style="font-weight:bold; border-bottom:2px solid ${teamId === 0 ? '#ef4444' : '#3b82f6'}; padding-bottom:5px; text-align:center;">${teamId === 0 ? 'RED' : 'BLUE'} TEAM (${teamState[teamId].kills} キル)</div><div class="result-list">`;
            units.filter(u => u.team === teamId).sort((a,b) => b.kills - a.kills).forEach(u => {
                h += `<div class="result-row"><span>${ROLE_SYMBOLS[u.roleKey]} ${u.playerName}</span><span><span class="kill-count">${u.kills}</span> キル</span></div>`;
            });
            return h + `</div>`;
        };
        
        document.getElementById('redResult').innerHTML = fmt(0); 
        document.getElementById('blueResult').innerHTML = fmt(1);
        document.getElementById('resultScreen').classList.remove('hidden');

        // ★ バトル終了アナウンス
        speak(speechText);
    }

    function loop() {
        if (isGameOver) return; 
        animId = requestAnimationFrame(loop);
        
        if (!isPaused) { 
            for (let i = 0; i < gameSpeed; i++) { 
                updateLogic(); 
                if (isGameOver) return; 
            } 
        }
        drawLogic();
    }

    function updateLogic() {
        frameCount++; 
        if (frameCount % 60 === 0) updateStrategy();
        
        battleTimer--; 
        if (battleTimer <= 0) { endGame(); return; }
        
        updateEffects(); 
        controlPoints.forEach(cp => cp.update(units)); 
        units.forEach(u => u.update());
        
        const rS = controlPoints.filter(cp => cp.owner === 0).length;
        const bS = controlPoints.filter(cp => cp.owner === 1).length;
        if (rS === 5 || bS === 5) { endGame(); return; }
        
        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i]; p.x += p.vx; p.y += p.vy; p.life--;
            let hit = units.find(u => u.team !== p.team && u.state === 'alive' && dist(u.x, u.y, p.x, p.y) < 12);
            if (hit) { 
                let defVal = hit.isInvincible ? 999999 : hit.getDef();
                let actual = Math.max(1, p.dmg * (1000 / (1000 + defVal)));
                hit.hp -= actual; 
                
                if (p.vamp > 0 && p.owner.state === 'alive') {
                    p.owner.hp = Math.min(p.owner.getMaxHp(), p.owner.hp + actual * p.vamp);
                }
                if (p.stun > 0) hit.stunTimer = Math.max(hit.stunTimer, p.stun);
                if (hit.hp <= 0) processKill(p.owner, hit, p.team);
                p.life = 0; 
            }
            if (p.life <= 0 || !mapData[Math.floor(p.y/TILE)] || !mapData[Math.floor(p.y/TILE)][Math.floor(p.x/TILE)]) {
                projectiles.splice(i, 1);
            }
        }
    }

    function drawLogic() {
        drawFrameCount++; 
        if (drawFrameCount % 6 === 0) updateDashboard();
        
        const mins = Math.floor(battleTimer / 3600);
        const secs = Math.floor((battleTimer % 3600) / 60);
        document.getElementById('timerDisplay').innerText = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        
        document.getElementById('scoreRed').innerText = controlPoints.filter(cp => cp.owner === 0).length;
        document.getElementById('scoreBlue').innerText = controlPoints.filter(cp => cp.owner === 1).length;
        
        ctx.clearRect(0, 0, WIDTH, HEIGHT); 
        ctx.drawImage(bgCanvas, 0, 0);
        
        drawEffects(); 
        controlPoints.forEach(cp => cp.draw()); 
        units.forEach(u => u.draw());
        
        projectiles.forEach(p => { 
            ctx.fillStyle = "#ff0"; 
            ctx.fillRect(p.x-1, p.y-1, 3, 3); 
        });
        
        drawTooltip();
    }
</script>
</body>
</html>
